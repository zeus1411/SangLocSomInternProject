version: "3.9"

networks:
  appnet:
    driver: bridge

volumes:
  db_data:
  minio_data:

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - appnet

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-admin_ecdd}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-admin_ecdd}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - appnet

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-12345678}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - appnet

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: ["/bin/sh","-c"]
    command: >
      mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD
      && mc mb --ignore-existing local/images-public
      && mc mb --ignore-existing local/private
      && mc anonymous set download local/images-public
      && mc anonymous set none local/private
      && mc ilm rule add --expire-days "$IMAGES_TTL_DAYS" local/images-public
      && mc ilm rule add --expire-days "$PRIVATE_TTL_DAYS" local/private
      && if [ -f /cors.MinIO.json ]; then mc cors set local/images-public /cors.MinIO.json; fi
      && echo 'MinIO buckets ready'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-12345678}
      IMAGES_TTL_DAYS: ${IMAGES_TTL_DAYS:-60}
      PRIVATE_TTL_DAYS: ${PRIVATE_TTL_DAYS:-90}
    volumes:
      - ./cors.MinIO.json:/cors.MinIO.json:ro
    networks:
      - appnet

  traefik:
    image: traefik:v2.11
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
    ports:
      - "8082:80"
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - appnet

  backend:
    build:
      context: ./ecdd_be2
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      # Nếu cần chờ minio-init xong trước:
      # minio-init:
      #   condition: service_completed_successfully
    env_file:
      - ./ecdd_be2/.env.docker
    environment:
      NODE_ENV: "production"
      # Đảm bảo backend nói chuyện đúng service name trong Docker network:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_TTL: "3600"
      # Đảm bảo DB host trỏ về service 'db':
      DB_HOST: "db"
      DB_PORT: "5432"
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - appnet

  frontend:
    build:
      context: ./ecdd_fe2
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - appnet
