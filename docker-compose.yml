

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admin_ecdd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admin_ecdd"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./ecdd_be2
      dockerfile: Dockerfile
    env_file:
      - ./ecdd_be2/.env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./ecdd_fe2
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000"   # S3 API
      - "9090:9090"   # MinIO Console (UI)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-12345678}
    volumes:
      - minio_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  db_data:
  minio_data:
