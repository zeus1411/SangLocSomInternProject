version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admin_ecdd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admin_ecdd"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./ecdd_be2
      dockerfile: Dockerfile
    env_file:
      - ./ecdd_be2/.env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./ecdd_fe2
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  db_data:
